name: Update NewsMorocco Feed

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Refresh Moroccan news 4 times every day.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Moroccan breaking news
        run: python fetch-news.py

      - name: Build permanent article archive
        run: python build-archive.py

      - name: Save generated news feed, article pages, archive and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json articles-index.json sitemap.xml article-*.html
          if ! git diff --cached --quiet; then
            git commit -m "Update news feed and preserve article archive"
            git push
          else
            echo "No news feed, archive, article page or sitemap changes."
          fi
