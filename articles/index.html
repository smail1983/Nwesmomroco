<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>جميع المقالات | NewsMorocco</title>
<meta name="description" content="جميع مقالات وأخبار NewsMorocco: السياسة والاقتصاد والتكنولوجيا والرياضة وآخر الأخبار المغربية.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://nwesmomroco.com/articles/"><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f6f7f9;color:#17202a}header{background:#b21f2d;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}header .wrap{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:24px}.back{background:#fff;color:#b21f2d;padding:9px 14px;border-radius:8px}.wrap-main{max-width:1100px;margin:28px auto;padding:0 16px}h1{margin:0 0 8px;font-size:32px}.intro{color:#667085;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.filters button{border:1px solid #ddd;background:#fff;padding:9px 15px;border-radius:20px;cursor:pointer}.filters button.active{background:#087f5b;color:#fff;border-color:#087f5b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.07);display:flex;flex-direction:column}.card img{width:100%;height:175px;object-fit:cover}.card-body{padding:16px}.tag{display:inline-block;color:#087f5b;font-size:13px;font-weight:700;margin-bottom:8px}.card h2{font-size:19px;line-height:1.5;margin:0 0 9px}.card p{color:#667085;line-height:1.7;margin:0 0 12px}.date{font-size:12px;color:#98a2b3;margin-bottom:12px}.read{display:inline-block;background:#087f5b;color:#fff;text-decoration:none;padding:9px 13px;border-radius:8px}.status{text-align:center;padding:30px;color:#667085}
#reader{display:none;position:fixed;inset:0;background:#f6f7f9;z-index:1000;overflow:auto}#reader.show{display:block}.reader-bar{position:sticky;top:0;background:#b21f2d;color:#fff;padding:14px 16px;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.15)}.reader-bar-inner{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.close-reader{border:0;background:#fff;color:#b21f2d;padding:10px 18px;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer}.reader-frame{display:block;width:min(100%,1000px);height:calc(100vh - 68px);min-height:650px;margin:0 auto;border:0;background:#fff}@media(max-width:600px){h1{font-size:26px}.logo{font-size:20px}.card img{height:160px}.reader-frame{min-height:calc(100vh - 68px)}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../">News<span>Morocco</span></a><a class="back" href="../">الرئيسية</a></div></header>
<main class="wrap-main"><h1>جميع المقالات</h1><div class="intro">آخر الأخبار والمقالات المغربية في مكان واحد.</div><div class="filters" aria-label="تصنيف المقالات"><button class="active" data-cat="all">الكل</button><button data-cat="policy">السياسة</button><button data-cat="business">الاقتصاد</button><button data-cat="technology">التكنولوجيا</button><button data-cat="sports">الرياضة</button></div><section id="articles" class="grid"><div class="status">جاري تحميل المقالات...</div></section></main>
<div id="reader" aria-hidden="true"><div class="reader-bar"><div class="reader-bar-inner"><strong>NewsMorocco</strong><button class="close-reader" id="closeReader">← العودة إلى المقالات</button></div></div><iframe id="readerFrame" class="reader-frame" title="مقال NewsMorocco"></iframe></div>
<script>
const labels={policy:'سياسة',business:'اقتصاد',technology:'تكنولوجيا',sports:'رياضة',general:'أخبار'};const box=document.getElementById('articles');const reader=document.getElementById('reader');const frame=document.getElementById('readerFrame');let all=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function formatDate(s){try{return new Intl.DateTimeFormat('ar-MA',{dateStyle:'medium'}).format(new Date(s))}catch(e){return ''}}
function articleUrl(url){if(!url)return '#';return /^https?:\/\//.test(url)?url:(url.startsWith('/')?url:'../'+url)}
function render(cat='all'){const items=cat==='all'?all:all.filter(a=>a.category===cat);if(!items.length){box.innerHTML='<div class="status">لا توجد مقالات في هذا التصنيف حالياً.</div>';return}box.innerHTML=items.map(a=>`<article class="card"><img src="${esc(a.image||'../favicon.svg')}" alt="${esc(a.title)}" loading="lazy"><div class="card-body"><span class="tag">${labels[a.category]||'أخبار'}</span><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}</p><div class="date">${formatDate(a.date)}</div><a class="read" href="${esc(articleUrl(a.url))}" data-open-article="${esc(articleUrl(a.url))}">اقرأ المقال</a></div></article>`).join('')}
function openReader(url){frame.src=url;reader.classList.add('show');reader.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';history.pushState({article:url},'',url)}
function closeReader(){reader.classList.remove('show');reader.setAttribute('aria-hidden','true');frame.src='about:blank';document.body.style.overflow='';history.pushState({},'',location.origin+'/articles/');}
document.addEventListener('click',e=>{const a=e.target.closest('[data-open-article]');if(a){e.preventDefault();openReader(a.dataset.openArticle)}});document.getElementById('closeReader').onclick=closeReader;window.addEventListener('popstate',()=>{if(reader.classList.contains('show'))closeReader()});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});
async function loadArticles(){try{const manual=await fetch('../manual-news.json?v=20261018',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});all=Array.isArray(manual)?manual:(manual.content?JSON.parse(manual.content):[])}catch(e){all=[]}if(!all.length){try{const feed=await fetch('../news.json?v=20261018',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});const parsed=feed.content?JSON.parse(feed.content):feed;all=Array.isArray(parsed)?parsed:(parsed.articles||[])}catch(e){all=[]}}render()}loadArticles();
</script></body></html>
