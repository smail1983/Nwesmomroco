<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جميع المقالات | NewsMorocco</title>
  <meta name="description" content="جميع مقالات وأخبار NewsMorocco: السياسة والاقتصاد والتكنولوجيا والرياضة وآخر الأخبار المغربية.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://nwesmomroco.com/articles/">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f6f7f9;color:#17202a}header{background:#b21f2d;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}header .wrap{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:24px}.back{background:#fff;color:#b21f2d;padding:9px 14px;border-radius:8px}.wrap-main{max-width:1100px;margin:28px auto;padding:0 16px}h1{margin:0 0 8px;font-size:32px}.intro{color:#667085;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.filters button{border:1px solid #ddd;background:#fff;padding:9px 15px;border-radius:20px;cursor:pointer}.filters button.active{background:#087f5b;color:#fff;border-color:#087f5b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.07);display:flex;flex-direction:column}.card img{width:100%;height:175px;object-fit:cover}.card-body{padding:16px}.tag{display:inline-block;color:#087f5b;font-size:13px;font-weight:700;margin-bottom:8px}.card h2{font-size:19px;line-height:1.5;margin:0 0 9px}.card p{color:#667085;line-height:1.7;margin:0 0 12px}.date{font-size:12px;color:#98a2b3;margin-bottom:12px}.read{display:inline-block;background:#087f5b;color:#fff;text-decoration:none;padding:9px 13px;border-radius:8px}.status{text-align:center;padding:30px;color:#667085}@media(max-width:600px){h1{font-size:26px}.logo{font-size:20px}.card img{height:160px}}
  </style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../">News<span>Morocco</span></a><a class="back" href="../">الرئيسية</a></div></header>
<main class="wrap-main">
  <h1>جميع المقالات</h1>
  <div class="intro">آخر الأخبار والمقالات المغربية في مكان واحد.</div>
  <div class="filters" aria-label="تصنيف المقالات">
    <button class="active" data-cat="all">الكل</button><button data-cat="policy">السياسة</button><button data-cat="business">الاقتصاد</button><button data-cat="technology">التكنولوجيا</button><button data-cat="sports">الرياضة</button>
  </div>
  <section id="articles" class="grid"><div class="status">جاري تحميل المقالات...</div></section>
</main>
<script>
const labels={policy:'سياسة',business:'اقتصاد',technology:'تكنولوجيا',sports:'رياضة',general:'أخبار'};
const box=document.getElementById('articles');
let all=[];
function render(cat='all'){
  const items=cat==='all'?all:all.filter(a=>a.category===cat);
  if(!items.length){box.innerHTML='<div class="status">لا توجد مقالات في هذا التصنيف حالياً.</div>';return;}
  box.innerHTML=items.map(a=>`<article class="card"><img src="${a.image||'../favicon.svg'}" alt="${esc(a.title)}" loading="lazy"><div class="card-body"><span class="tag">${labels[a.category]||'أخبار'}</span><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}</p><div class="date">${formatDate(a.date)}</div><a class="read" href="../${a.url}">اقرأ المقال</a></div></article>`).join('');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatDate(s){try{return new Intl.DateTimeFormat('ar-MA',{dateStyle:'medium'}).format(new Date(s))}catch(e){return ''}}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});
fetch('../manual-news.json').then(r=>r.json()).then(data=>{all=Array.isArray(data)?data:(data.content?JSON.parse(data.content):[]);render()}).catch(()=>{box.innerHTML='<div class="status">تعذر تحميل المقالات حالياً.</div>'});
</script>
</body>
</html>
