<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف جميع المقالات | NewsMorocco</title>
<meta name="description" content="أرشيف جميع مقالات وأخبار NewsMorocco، بما في ذلك الأخبار القديمة والجديدة في السياسة والرياضة والاقتصاد والتكنولوجيا.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://nwesmomroco.com/articles/">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#17212b;font-family:Arial,"Noto Sans Arabic",sans-serif;line-height:1.8}header{background:#17212b;color:#fff;padding:18px 16px}header .wrap{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{color:#fff;text-decoration:none;font-size:24px;font-weight:800}.logo span{color:#ef4b3f}.home{color:#fff;text-decoration:none;background:#ef4b3f;padding:8px 14px;border-radius:8px}.wrap{max-width:1100px;margin:auto}.main{padding:28px 16px}h1{margin:0 0 8px;font-size:32px}.intro{color:#667085;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.filters button{border:1px solid #ddd;background:#fff;padding:9px 15px;border-radius:20px;cursor:pointer}.filters button.active{background:#087f5b;color:#fff;border-color:#087f5b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.07);display:flex;flex-direction:column}.card img{width:100%;height:175px;object-fit:cover;background:#eee}.card-body{padding:16px}.tag{display:inline-block;color:#087f5b;font-size:13px;font-weight:700;margin-bottom:7px}.card h2{font-size:19px;line-height:1.5;margin:0 0 9px}.card p{color:#667085;line-height:1.7;margin:0 0 10px}.date{font-size:12px;color:#98a2b3;margin-bottom:12px}.read{display:inline-block;background:#087f5b;color:#fff;text-decoration:none;padding:9px 13px;border-radius:8px}.status{text-align:center;padding:35px;color:#667085;background:#fff;border-radius:14px}@media(max-width:600px){h1{font-size:26px}.logo{font-size:20px}.card img{height:160px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../">News<span>Morocco</span></a><a class="home" href="../">الرئيسية</a></div></header>
<main class="wrap main">
<h1>أرشيف جميع المقالات</h1>
<p class="intro">الأخبار الجديدة تظهر في الرئيسية، أما المقالات القديمة فتبقى محفوظة هنا ولا تختفي مع تحديث الأخبار.</p>
<div class="filters"><button class="active" data-cat="all">الكل</button><button data-cat="policy">السياسة</button><button data-cat="business">الاقتصاد</button><button data-cat="technology">التكنولوجيا</button><button data-cat="sports">الرياضة</button></div>
<section id="articles" class="grid"><div class="status">جاري تحميل الأرشيف...</div></section>
</main>
<script>
const labels={policy:'سياسة',business:'اقتصاد',technology:'تكنولوجيا',sports:'رياضة',general:'أخبار'};
const box=document.getElementById('articles');let all=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function urlFor(s){if(!s)return '#';if(/^https?:\/\//i.test(s))return s;if(s.startsWith('/'))return '..'+s;return '../'+s;}
function render(cat='all'){const items=cat==='all'?all:all.filter(a=>a.category===cat);if(!items.length){box.innerHTML='<div class="status">لا توجد مقالات في هذا التصنيف.</div>';return;}box.innerHTML=items.map(a=>`<article class="card"><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"><div class="card-body"><span class="tag">${labels[a.category]||'أخبار'}</span><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}</p><div class="date">${esc(a.date||'')}</div><a class="read" href="${esc(urlFor(a.url))}">اقرأ المقال</a></div></article>`).join('');}
async function load(){try{const r=await fetch('../articles-index.json?v=20261021',{cache:'no-store'});if(!r.ok)throw new Error('archive unavailable');all=await r.json();if(!Array.isArray(all))all=[];render();}catch(e){box.innerHTML='<div class="status">تعذر تحميل الأرشيف حالياً. جرّب مرة أخرى لاحقاً.</div>';}}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat);}));
load();
</script>
</body>
</html>
