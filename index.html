<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NewsMorocco">
<title>NewsMorocco | آخر أخبار المغرب والعالم</title>
<meta name="description" content="NewsMorocco — تابع آخر أخبار المغرب والعالم في الاقتصاد والتكنولوجيا والرياضة والمجتمع، بتحديثات إخبارية متجددة.">
<meta name="robots" content="index, follow">
<link rel="stylesheet" href="style-mobile-fixed.css">
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="#" class="logo">News<span>Morocco</span></a>
    <nav>
      <a href="#" data-category="general">الرئيسية</a>
      <a href="#" data-category="business">اقتصاد</a>
      <a href="#" data-category="technology">تكنولوجيا</a>
      <a href="#" data-category="sports">رياضة</a>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>نبض المغرب والعالم</h1>
  <p>اكتشف آخر الأخبار وأهم المستجدات لحظة بلحظة</p>
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="ابحث عن خبر..." aria-label="البحث عن خبر">
    <button id="searchButton">بحث</button>
  </div>
</section>

<main>
  <div class="section-title"><h2 id="sectionTitle">أحدث الأخبار</h2></div>
  <section id="newsContainer" class="news-container">
    <div class="loading">جاري تحميل الأخبار...</div>
  </section>
</main>


<section id="installAppBox" class="install-app-box" style="display:block !important;visibility:visible !important;opacity:1 !important;margin:18px 16px;text-align:center;">
  <div style="background:#17212b;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);">
  <button id="installAppButton" type="button" style="border:0;border-radius:10px;padding:13px 22px;background:#10b981;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">📱 تثبيت تطبيق NewsMorocco</button>
  </div>
</section>

<footer><p>© 2026 NewsMorocco. جميع الحقوق محفوظة.</p></footer>

<script>
let deferredInstallPrompt = null;
const installBox = document.getElementById('installAppBox');
const installButton = document.getElementById('installAppButton');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  if (installBox) {
    installBox.style.display = 'block';
    installBox.style.visibility = 'visible';
    installBox.style.opacity = '1';
  }
  if (installButton) installButton.textContent = '📱 تثبيت تطبيق NewsMorocco';
});

window.addEventListener('DOMContentLoaded', () => {
  if (installBox) {
    installBox.style.display = 'block';
    installBox.style.visibility = 'visible';
    installBox.style.opacity = '1';
  }
});

if (installButton) {
  installButton.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return;
    }
    alert('إذا لم يظهر التثبيت تلقائياً، افتح قائمة Chrome ⋮ ثم اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
  });
}

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  if (installBox) installBox.style.setProperty('display', 'none', 'important');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

<script src="script.js?v=20260929"></script>
</body>
</html>
