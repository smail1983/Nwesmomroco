<link rel="stylesheet" href="style-mobile-fixed.css">
<style>
#newsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0 16px 30px}
.news-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.08);border:1px solid #eee}
.news-card a{display:block;color:inherit;text-decoration:none}
.news-card img{display:block;width:100%;height:220px;object-fit:cover;background:#eee}
.news-body{padding:16px}
.news-category{display:inline-block;background:#d71920;color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:8px}
.news-card h2{margin:2px 0 8px;font-size:20px;line-height:1.55}
.news-card p{margin:0;color:#666;line-height:1.8;font-size:14px}
.news-meta{margin-top:10px;color:#888;font-size:12px}
.empty-news{margin:0 16px 30px;padding:24px;background:#fff;border-radius:14px;text-align:center;color:#666}
@media(max-width:768px){#newsGrid{grid-template-columns:1fr;gap:15px}.news-card img{height:auto;max-height:320px}.news-card h2{font-size:19px}}
</style>

<body>
<header class="header">
<div class="header-inner">
<a href="/" class="logo">News<span>Morocco</span></a>

</nav>
</div>
</header>
<section class="hero">
<h1>نبض المغرب والعالم</h1>
<p>آخر الأخبار المغربية وأهم المستجدات لحظة بلحظة</p>
<div style="margin:16px 16px 18px;text-align:center;position:relative;z-index:5;"><a href="https://github.com/smail1983/NewsMorocco-App/releases/latest/download/NewsMorocco.apk" target="_blank" rel="noopener" style="display:block;width:100%;border-radius:10px;padding:13px 22px;background:#2563eb;color:#fff;text-decoration:none;font-size:16px;font-weight:700;">⬇️ تحميل APK NewsMorocco</a></div>
<div style="margin:0 16px 18px;text-align:center;position:relative;z-index:5;"><a href="https://www.tiktok.com/@akhbaralmaghribe" target="_blank" rel="noopener noreferrer" style="display:block;width:100%;border-radius:10px;padding:12px 22px;background:#111;color:#fff;text-decoration:none;font-size:16px;font-weight:700;">🎵 تابع أخبار المغرب على TikTok</a></div>
<div class="search-box"><input type="search" id="searchInput" placeholder="ابحث عن خبر..." aria-label="البحث عن خبر"><button id="searchButton">بحث</button></div>
</section>
<main>
<div class="section-title"><h2 id="sectionTitle">أحدث الأخبار</h2></div>
<div id="newsGrid" aria-live="polite"></div>
<div id="emptyNews" class="empty-news" hidden>لا توجد أخبار حديثة حالياً.</div>
</main>
<script>
const FALLBACK_IMAGE='https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=900&q=80';
const categoryNames={policy:'🇲🇦 سياسة',sports:'⚽ الرياضة المغربية',business:'💰 الاقتصاد',technology:'🤖 التكنولوجيا',general:'📰 أخبار المغرب'};
let allNews=[];
function escapeHtml(value){return String(value||'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
function newsDate(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.toLocaleDateString('ar-MA',{day:'numeric',month:'long',year:'numeric'});}
function isRecent(item){const d=new Date(item.date||0);if(Number.isNaN(d.getTime()))return false;return (Date.now()-d.getTime())<=3*24*60*60*1000;}
function renderNews(items){const grid=document.getElementById('newsGrid'),empty=document.getElementById('emptyNews');grid.innerHTML='';if(!items.length){empty.hidden=false;return;}empty.hidden=true;items.slice(0,12).forEach(item=>{const card=document.createElement('article');card.className='news-card';const href=String(item.url||'#');const external=/^https?:\/\//i.test(href);const target=external?' target="_blank" rel="noopener noreferrer"':'';card.innerHTML=`<a href="${escapeHtml(href)}"${target}><img src="${escapeHtml(item.image||FALLBACK_IMAGE)}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='${FALLBACK_IMAGE}'"><div class="news-body"><div class="news-category">${escapeHtml(categoryNames[item.category]||'📰 أخبار المغرب')}</div><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.description||'آخر المستجدات والأخبار.')}</p><div class="news-meta">${escapeHtml(item.domain||'NewsMorocco')}${newsDate(item.date)?' • '+escapeHtml(newsDate(item.date)):''}</div></div></a>`;grid.appendChild(card);});}
function applyFilters(category='all',query=''){const q=query.trim().toLowerCase();const filtered=allNews.filter(item=>{const categoryOk=category==='all'||item.category===category;const text=`${item.title||''} ${item.description||''} ${item.domain||''}`.toLowerCase();return categoryOk&&(!q||text.includes(q));});renderNews(filtered);document.getElementById('sectionTitle').textContent=q?'نتائج البحث':category==='all'?'أحدث الأخبار':(categoryNames[category]||'الأخبار');}
async function loadNews(){try{const response=await fetch('news.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('news.json unavailable');const data=await response.json();allNews=(Array.isArray(data.articles)?data.articles:[]).filter(isRecent);allNews.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));applyFilters();}catch(error){console.error(error);renderNews([]);}}
document.querySelectorAll('[data-category]').forEach(link=>{link.addEventListener('click',event=>{event.preventDefault();applyFilters(link.dataset.category,document.getElementById('searchInput').value);window.scrollTo({top:document.querySelector('main').offsetTop-10,behavior:'smooth'});});});
document.getElementById('searchButton').addEventListener('click',()=>applyFilters('all',document.getElementById('searchInput').value));
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters('all',e.target.value)});
loadNews();
</script>
